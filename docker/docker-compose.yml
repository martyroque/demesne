version: "3.8"

services:
  whisper:
    container_name: whisper
    image: rhasspy/wyoming-whisper:latest
    restart: unless-stopped
    ports:
      - "10300:10300"
    command: --model tiny-int8 --language en
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "10300"]
      interval: 30s
      timeout: 10s
      retries: 3

  whisper-bridge:
    build: ./whisper-bridge
    container_name: demesne-whisper-bridge
    ports:
      - "10301:10301"
    environment:
      - WHISPER_HOST=whisper
      - WHISPER_PORT=10300
      - BRIDGE_HOST=0.0.0.0
      - BRIDGE_PORT=10301
      - CORS_ORIGINS=*
    depends_on:
      - whisper
    restart: unless-stopped

  piper:
    container_name: piper
    image: rhasspy/wyoming-piper:latest
    restart: unless-stopped
    ports:
      - "10200:10200"
    command: --voice en_US-lessac-medium --voice en_US-amy-medium
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "10200"]
      interval: 30s
      timeout: 10s
      retries: 3

  piper-bridge:
    build: ./piper-bridge
    container_name: demesne-piper-bridge
    ports:
      - "10201:10201"
    environment:
      - PIPER_HOST=piper
      - PIPER_PORT=10200
      - BRIDGE_HOST=0.0.0.0
      - BRIDGE_PORT=10201
      - CORS_ORIGINS=*
    depends_on:
      - piper
    restart: unless-stopped
