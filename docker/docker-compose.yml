services:
  whisper:
    container_name: whisper
    image: rhasspy/wyoming-whisper:latest
    restart: unless-stopped
    ports:
      - "10300:10300"
    command: --model tiny-int8 --language en

  whisper-bridge:
    build: ./whisper-bridge
    container_name: demesne-whisper-bridge
    ports:
      - "10301:10301"
    environment:
      - WHISPER_HOST=whisper
      - WHISPER_PORT=10300
      - BRIDGE_HOST=0.0.0.0
      - BRIDGE_PORT=10301
      - CORS_ORIGINS=*
    depends_on:
      - whisper
    restart: unless-stopped

  piper:
    container_name: piper
    image: rhasspy/wyoming-piper:latest
    restart: unless-stopped
    ports:
      - "10200:10200"
    command: --voice en_US-amy-medium

  piper-bridge:
    build: ./piper-bridge
    container_name: demesne-piper-bridge
    ports:
      - "10201:10201"
    environment:
      - PIPER_HOST=piper
      - PIPER_PORT=10200
      - BRIDGE_HOST=0.0.0.0
      - BRIDGE_PORT=10201
      - CORS_ORIGINS=*
    depends_on:
      - piper
    restart: unless-stopped

  openwakeword:
    container_name: openwakeword
    image: rhasspy/wyoming-openwakeword:latest
    restart: unless-stopped
    ports:
      - "10400:10400"
    command: --debug

  wakeword-bridge:
    build: ./wakeword-bridge
    container_name: demesne-wakeword-bridge
    ports:
      - "10401:10401"
    environment:
      - WAKEWORD_HOST=openwakeword
      - WAKEWORD_PORT=10400
      - BRIDGE_HOST=0.0.0.0
      - BRIDGE_PORT=10401
      - CORS_ORIGINS=*
    depends_on:
      - openwakeword
    restart: unless-stopped

  qdrant:
    container_name: demesne-qdrant
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
